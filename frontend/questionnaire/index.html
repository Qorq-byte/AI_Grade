<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调查问卷生成 — 云海睿评</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@1.72.0"></script>
    <style>
/* 去掉 Tailwind CDN 后补回它 preflight 里影响观感的部分 */
h1,h2,h3,h4,h5,h6{font-size:inherit;font-weight:inherit}
ul,ol{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{display:block;vertical-align:middle}
table{border-collapse:collapse}

        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #e2e8f0;
            --accent: #6FFF00;
            --muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 24px; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.2s;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
        }
        .btn:hover { background: #334155; }
        .btn-accent { background: var(--accent); color: #000; border-color: var(--accent); }
        .btn-accent:hover { background: #5ee600; }
        .btn-sm { padding: 4px 12px; font-size: 0.75rem; }
        input, select {
            padding: 8px 12px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.9rem;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent); }
        .question-item {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }
        .question-item:hover { border-color: #475569; }
        .likert-option {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--border);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.15s;
            margin: 2px;
        }
        .likert-option:hover { border-color: var(--accent); }
        .likert-option.selected { background: var(--accent); color: #000; border-color: var(--accent); }
        .likert-scale {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .likert-label {
            font-size: 0.7rem;
            color: var(--muted);
            width: 36px;
            text-align: center;
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 300;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } }
        .toast-success { background: #22c55e; color: #fff; }
        .toast-error { background: #ef4444; color: #fff; }
        .stats-card {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .stat {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 20px;
            text-align: center;
            min-width: 100px;
        }
        .stat .num { font-size: 1.5rem; font-weight: 700; }
        .stat .lbl { font-size: 0.75rem; color: var(--muted); }
        .tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .tag-likert { background: rgba(59,130,246,0.15); color: #3b82f6; }
        .tag-open { background: rgba(34,197,94,0.15); color: #22c55e; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div style="display:flex; align-items:center; gap:16px; margin-bottom:24px;">
            <a href="/" style="color:var(--muted); text-decoration:none;">← 返回</a>
            <h1 style="font-size:1.4rem; font-weight:700;">📋 调查问卷</h1>
        </div>

        <!-- Session Input -->
        <div class="card" id="session-card">
            <h3 style="margin-bottom:12px;">关联工作流会话</h3>
            <div style="display:flex; gap:8px;">
                <input id="session-input" placeholder="输入 session ID..." style="flex:1;" 
                    value="">
                <button class="btn btn-accent" onclick="loadQuestionnaire()">🚀 生成问卷</button>
            </div>
        </div>

        <!-- Controls -->
        <div class="card hidden" id="controls-card">
            <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                <label style="font-size:0.85rem;">最大题数:</label>
                <button class="btn btn-accent" onclick="reloadQuestionnaire()">🔄 重新加载</button>
                <button class="btn" onclick="exportAsCSV()">📥 导出 CSV</button>
                <button class="btn btn-accent" onclick="submitAnswers()">📤 提交答卷</button>
                <button class="btn" onclick="printQuestionnaire()">🖨️ 打印</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-card hidden" id="stats-card">
            <div class="stat"><div class="num" id="stat-total">0</div><div class="lbl">总题数</div></div>
            <div class="stat"><div class="num" id="stat-likert">0</div><div class="lbl">量表题</div></div>
            <div class="stat"><div class="num" id="stat-open">0</div><div class="lbl">开放题</div></div>
            <div class="stat"><div class="num" id="stat-answered">0</div><div class="lbl">已作答</div></div>
        </div>

        <!-- Questionnaire -->
        <div id="questionnaire-container"></div>
    </div>

    <div id="toast-container"></div>

    <script src="/static/questionnaire/app.js" defer></script>
</body>
</html>
