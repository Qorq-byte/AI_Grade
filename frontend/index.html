<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="祺orQ - AI智能绩效评价系统，14步标准化评价流程，从资料整理到最终报告全自动生成。支持财政、人大、审计多视角分析，内置三级指标体系，一键导出Word/PDF专业报告。">
    <meta name="keywords" content="AI绩效评价,绩效评价报告,财政部门,指标体系,预算绩效,绩效管理,AI报告生成">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="祺orQ - AI智能绩效评价系统">
    <meta property="og:description" content="AI驱动的全流程绩效评价，分钟级生成符合财政部规范的完整评价报告">
    <meta property="og:type" content="website">
    <title>云海睿评 - AI智能绩效评价系统</title>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://db.onlinewebfonts.com">
    <link rel="dns-prefetch" href="https://unpkg.com">

    <!-- Fonts per design spec -->
    <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/04e6981992c0e2e7642af2074ebe3901?family=Helvetica+Now+Display+Bold" media="print" onload="this.media='all'">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Lucide Icons (deferred) -->
    <script src="https://unpkg.com/lucide@latest" defer></script>

    <style>
        :root {
            --font-heading: 'Helvetica Now Display Bold', 'Inter', sans-serif;
            --font-body: 'Inter', sans-serif;
            --color-text: #192837;
            --color-accent: #7342E2;
            --color-login-bg: #F2F2EE;
            --color-bg-light: #FAFAF8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-body);
            color: var(--color-text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            background: #F5F5F3;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        .navbar.scrolled {
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.04);
        }
        .navbar-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        @media (min-width: 640px) { .navbar-inner { padding: 20px 32px; } }

        /* Logo */
        .logo-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            z-index: 110;
        }
        .logo-svg {
            width: 32px; height: 32px;
            flex-shrink: 0;
        }
        .logo-svg path { fill: var(--color-text); }
        .logo-text {
            font-family: var(--font-heading);
            font-size: 17px;
            letter-spacing: -0.01em;
            color: var(--color-text);
        }

        /* Desktop Nav Links */
        .nav-links {
            display: none;
            align-items: center;
            gap: 36px;
            list-style: none;
        }
        @media (min-width: 768px) { .nav-links { display: flex; } }
        .nav-links a {
            color: var(--color-text);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .nav-links a:hover { opacity: 1; }

        /* Desktop Action Buttons */
        .nav-actions {
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 110;
        }
        @media (min-width: 768px) { .nav-actions { display: flex; } }

        .btn-nav-primary {
            padding: 10px 20px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font-body);
            cursor: pointer;
            border: none;
            background: var(--color-accent);
            color: white;
            transition: all 0.25s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        @media (min-width: 640px) { .btn-nav-primary { padding: 10px 22px; } }
        .btn-nav-primary:hover { transform: scale(1.03); filter: brightness(1.1); }

        .btn-nav-secondary {
            padding: 10px 20px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font-body);
            cursor: pointer;
            border: none;
            background: var(--color-login-bg);
            color: var(--color-text);
            transition: all 0.25s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        @media (min-width: 640px) { .btn-nav-secondary { padding: 10px 22px; } }
        .btn-nav-secondary:hover { filter: brightness(0.96); }

        /* Mobile Toggle */
        .mobile-toggle {
            display: flex;
            align-items: center; justify-content: center;
            width: 40px; height: 40px;
            border-radius: 10px;
            border: 1px solid rgba(25,40,55,0.12);
            background: transparent;
            color: var(--color-text);
            cursor: pointer;
            z-index: 110;
            transition: background 0.2s;
        }
        .mobile-toggle:hover { background: rgba(25,40,55,0.04); }
        @media (min-width: 768px) { .mobile-toggle { display: none; } }

        /* Mobile Overlay */
        .mobile-overlay {
            position: fixed;
            inset: 0;
            background: rgba(25,40,55,0.35);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 105;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .mobile-overlay.open { opacity: 1; pointer-events: all; }

        /* Mobile Sheet - exact per design spec */
        .mobile-sheet {
            position: fixed;
            top: 0; right: 0;
            width: min(88vw, 360px);
            height: 100dvh;
            background: #CFC8C5;
            z-index: 106;
            box-shadow: -12px 0 48px rgba(25,40,55,0.18);
            transform: translateX(100%);
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
        }
        .mobile-sheet.open { transform: translateX(0); }

        .mobile-sheet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
        }
        .mobile-sheet-header .logo-svg path { fill: var(--color-text); }
        .mobile-sheet-header .logo-text { color: var(--color-text); }
        .mobile-sheet-divider {
            height: 1px;
            background: rgba(25,40,55,0.1);
            margin: 0 24px;
        }
        .mobile-sheet-close {
            width: 36px; height: 36px;
            border-radius: 8px;
            border: 1px solid rgba(25,40,55,0.12);
            background: transparent;
            color: var(--color-text);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .mobile-sheet-nav {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .mobile-sheet-nav a {
            display: block;
            padding: 14px 16px;
            border-radius: 10px;
            color: var(--color-text);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            opacity: 0.75;
            transition: all 0.2s;
        }
        .mobile-sheet-nav a:hover {
            background: rgba(25,40,55,0.04);
            opacity: 1;
        }
        /* Staggered animation delays for mobile nav items */
        .mobile-sheet-nav a:nth-child(1) { transition-delay: 0.18s; }
        .mobile-sheet-nav a:nth-child(2) { transition-delay: 0.25s; }
        .mobile-sheet-nav a:nth-child(3) { transition-delay: 0.32s; }
        .mobile-sheet-nav a:nth-child(4) { transition-delay: 0.39s; }
        .mobile-sheet-nav a:nth-child(5) { transition-delay: 0.46s; }

        .mobile-sheet-cta {
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .mobile-sheet-cta .btn-nav-primary,
        .mobile-sheet-cta .btn-nav-secondary {
            width: 100%;
            justify-content: center;
            padding: 13px;
            font-size: 15px;
        }

        /* ===== HERO SECTION ===== */
        .hero-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Background video - per design spec: absolute inset-0, object-cover */
        .hero-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .hero-video.loaded { opacity: 1; }

        /* Fallback background shown when video is not available */
        .hero-video-fallback {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: linear-gradient(160deg, #E8E6E1 0%, #D5D3CE 20%, #C8C6C0 40%, #D9D6D1 60%, #E0DDD8 80%, #EAE8E3 100%);
            background-size: 400% 400%;
            animation: bgShift 12s ease-in-out infinite alternate;
            will-change: background-position;
        }
        @keyframes bgShift {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 100%; }
        }

        /* Subtle gradient overlay to ensure dark text readability on video */
        .hero-video-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background:
                linear-gradient(180deg, rgba(245,245,243,0.3) 0%, rgba(245,245,243,0.15) 30%, rgba(245,245,243,0.4) 100%);
        }

        /* Hero content container - per design: max-width 1280px, paddingTop clamp */
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 1280px;
            margin: 0 auto;
            padding: clamp(40px, 8vw, 72px) 20px 0;
            width: 100%;
        }
        @media (min-width: 640px) { .hero-content { padding-left: 32px; padding-right: 32px; } }

        /* Content block capped at max-width 560px */
        .hero-text-block {
            max-width: 560px;
        }

        /* Hero Heading - exact per design spec */
        .hero-heading {
            font-family: var(--font-heading);
            font-size: clamp(1.65rem, 5vw, 3rem);
            line-height: 1.05;
            letter-spacing: -0.01em;
            color: var(--color-text);
            margin-bottom: 24px;
            font-weight: 700;
        }
        .hero-heading .icon-inline {
            display: inline-block;
            vertical-align: middle;
            position: relative;
            top: -2px;
            width: 24px;
            height: 24px;
            color: var(--color-text);
        }

        /* Hero Subtext - exact per design spec */
        .hero-subtext {
            font-family: var(--font-body);
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            line-height: 1.65;
            opacity: 0.8;
            color: var(--color-text);
            max-width: 560px;
            margin-bottom: 32px;
        }

        /* CTA Button - exact per design spec */
        .btn-hero-cta {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            gap: 32px;
            min-width: 210px;
            padding: 17px 24px;
            border-radius: 50px;
            background: var(--color-accent);
            color: white;
            font-family: var(--font-body);
            font-size: clamp(0.9rem, 2vw, 1rem);
            font-weight: 600;
            border: none;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 24px rgba(115,66,226,0.28);
            transition: transform 0.25s, filter 0.25s;
        }
        .btn-hero-cta:hover { transform: scale(1.04); filter: brightness(1.1); }
        .btn-hero-cta:active { transform: scale(0.96); }

        .btn-hero-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-width: 210px;
            padding: 17px 24px;
            border-radius: 50px;
            background: var(--color-login-bg);
            color: var(--color-text);
            font-family: var(--font-body);
            font-size: clamp(0.9rem, 2vw, 1rem);
            font-weight: 500;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: filter 0.25s;
            justify-content: center;
        }
        .btn-hero-secondary:hover { filter: brightness(0.95); }

        .hero-cta-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        /* ===== FADE-UP ANIMATIONS ===== */
        .fade-up {
            opacity: 0;
            transform: translateY(28px) translateZ(0);
            transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform, opacity;
        }
        .fade-up.visible { opacity: 1; transform: translateY(0) translateZ(0); }
        .fade-up.d0 { transition-delay: 0.00s; }
        .fade-up.d1 { transition-delay: 0.15s; }
        .fade-up.d2 { transition-delay: 0.30s; }

        /* ===== SECTION COMMON ===== */
        .page-section {
            padding: 80px 20px;
            background: var(--color-bg-light);
        }
        @media (min-width: 640px) { .page-section { padding: 80px 32px; } }
        .section-dark {
            background: var(--color-text);
            color: rgba(255,255,255,0.9);
        }
        .section-dark .section-title { color: #fff; }
        .section-dark .section-desc { color: rgba(255,255,255,0.6); }
        .section-dark .section-label { color: #A78BFA; }
        .section-container {
            max-width: 1280px;
            margin: 0 auto;
        }
        .section-label {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--color-accent);
            margin-bottom: 16px;
        }
        .section-title {
            font-family: var(--font-heading);
            font-size: clamp(1.6rem, 3.5vw, 2.4rem);
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -0.01em;
            color: var(--color-text);
            margin-bottom: 16px;
        }
        .section-desc {
            font-size: 1rem;
            line-height: 1.65;
            opacity: 0.7;
            max-width: 560px;
            margin-bottom: 48px;
        }

        /* ===== FEATURES GRID ===== */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
        }
        .feature-card {
            padding: 30px 26px;
            border-radius: 18px;
            background: #fff;
            border: 1px solid rgba(25,40,55,0.06);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .feature-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(25,40,55,0.08);
        }
        .feature-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
        }
        .feature-icon.purple { background: rgba(115,66,226,0.08); color: #7342E2; }
        .feature-icon.amber { background: rgba(245,158,11,0.08); color: #D97706; }
        .feature-icon.blue { background: rgba(59,130,246,0.08); color: #2563EB; }
        .feature-icon.green { background: rgba(16,185,129,0.08); color: #059669; }
        .feature-card h3 {
            font-family: var(--font-heading);
            font-size: 17px;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }
        .feature-card p {
            font-size: 14px;
            line-height: 1.6;
            color: rgba(25,40,55,0.55);
        }

        /* Dark section feature cards */
        .section-dark .feature-card {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.06);
        }
        .section-dark .feature-card h3 { color: #fff; }
        .section-dark .feature-card p { color: rgba(255,255,255,0.5); }
        .section-dark .feature-card:hover {
            background: rgba(255,255,255,0.07);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .section-dark .feature-icon.purple { background: rgba(139,92,246,0.15); color: #A78BFA; }
        .section-dark .feature-icon.green { background: rgba(16,185,129,0.15); color: #34D399; }
        .section-dark .feature-icon.blue { background: rgba(96,165,250,0.15); color: #60A5FA; }

        /* ===== WORKFLOW STEPS ===== */
        .workflow-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
            gap: 10px;
        }
        .workflow-step {
            padding: 18px 14px;
            border-radius: 14px;
            background: #fff;
            border: 1px solid rgba(25,40,55,0.05);
            text-align: center;
            transition: all 0.3s;
        }
        .workflow-step:hover {
            border-color: var(--color-accent);
            box-shadow: 0 4px 16px rgba(115,66,226,0.08);
        }
        .workflow-step-num {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: rgba(115,66,226,0.1);
            color: var(--color-accent);
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            font-family: var(--font-body);
        }
        .workflow-step-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--color-text);
            line-height: 1.35;
            opacity: 0.75;
        }

        /* ===== CTA SECTION ===== */
        .cta-section {
            text-align: center;
            padding: 100px 20px;
            background: var(--color-bg-light);
        }
        @media (min-width: 640px) { .cta-section { padding: 100px 32px; } }
        .cta-card {
            max-width: 560px;
            margin: 0 auto;
            padding: 48px 36px;
            border-radius: 24px;
            background: #fff;
            border: 1px solid rgba(25,40,55,0.06);
        }
        .cta-card h2 {
            font-family: var(--font-heading);
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 14px;
            letter-spacing: -0.01em;
        }
        .cta-card p {
            font-size: 1rem;
            color: rgba(25,40,55,0.6);
            line-height: 1.65;
            margin-bottom: 28px;
        }
        .cta-card .btn-hero-cta { margin: 0 auto; justify-content: center; }

        /* ===== FOOTER ===== */
        .footer {
            padding: 40px 20px 28px;
            background: var(--color-bg-light);
            border-top: 1px solid rgba(25,40,55,0.06);
        }
        @media (min-width: 640px) { .footer { padding: 40px 32px 28px; } }
        .footer-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }
        .footer-copy {
            font-size: 13px;
            color: rgba(25,40,55,0.4);
        }
        .footer-links {
            display: flex;
            gap: 22px;
            list-style: none;
        }
        .footer-links a {
            font-size: 13px;
            color: rgba(25,40,55,0.4);
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer-links a:hover { color: var(--color-text); }
    </style>
</head>
<body>
