<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 — 云海睿评</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#f8f9fa;--card:#fff;--border:#e2e8f0;--text:#1a202c;--text2:#4a5568;--muted:#718096;--accent:#667eea;--accent-light:#ebf5ff;--danger:#ef4444;--danger-bg:#fff5f5;--warning:#f59e0b;--warning-bg:#fffaf0;--info:#3b82f6;--success:#48bb78;--success-bg:#f0fff4}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
.sidebar{width:240px;background:white;border-right:1px solid var(--border);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;display:flex;flex-direction:column}
.main-content{margin-left:240px;padding:32px;min-height:100vh}
.card{background:white;border:1px solid var(--border);border-radius:12px;padding:24px;transition:all .2s}.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-2px)}
.stat-card{background:white;border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;transition:all .2s}
.stat-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-2px)}
.stat-card .value{font-size:28px;font-weight:700;color:var(--text)}
.stat-card .label{font-size:.8rem;color:var(--muted);margin-top:4px}
.stat-card .sub{font-size:.72rem;color:#a0aec0}
.btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:white;color:var(--text2);cursor:pointer;font-size:.85rem;transition:.2s;display:inline-flex;align-items:center;gap:6px}.btn:hover{background:#f8f9fa}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500}.btn-primary:hover{background:#5a6fd6;border-color:#5a6fd6}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger)}.btn-danger:hover{background:var(--danger-bg)}
.btn-success{padding:8px 20px;height:38px;background:#48bb78;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer}.btn-success:hover{background:#38a169}
.btn-sm{padding:4px 10px;font-size:.75rem}.btn-lg{padding:10px 22px;font-size:.95rem}
.table-view{width:100%;border-collapse:collapse;font-size:.875rem}
.table-view th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--border);color:var(--muted);font-weight:600;position:sticky;top:0;background:#fff}
.table-view td{padding:10px 12px;border-bottom:1px solid #f0f0f0}
.table-view tr:hover td{background:#f8f9fa}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.73rem;font-weight:600}
.badge-success{background:#f0fff4;color:#22543d}.badge-warning{background:#fffaf0;color:#744210}.badge-danger{background:#fff5f5;color:#742a2a}.badge-info{background:#ebf5ff;color:#2c5282}
.nav-section{padding:10px 18px 4px;font-size:.7rem;color:#a0aec0;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;color:var(--text2);cursor:pointer;transition:all .2s;border-radius:6px;font-size:.875rem;margin:0 6px}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:500}
.nav-item.active .nav-icon{color:var(--accent)}
.nav-icon{flex-shrink:0;min-width:22px;display:flex;align-items:center;justify-content:center;color:#a0aec0}
.nav-item.active .nav-icon{color:var(--accent)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:white;border:1px solid var(--border);border-radius:14px;padding:28px;min-width:420px;max-width:640px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal input,.modal select,.modal textarea{width:100%;padding:9px 11px;background:#fff;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.88rem;margin-bottom:10px;font-family:inherit}
.modal textarea{min-height:120px;resize:vertical}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(102,126,234,.1)}
.modal label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}
.modal h3{font-size:1.1rem;margin-bottom:8px;color:var(--text)}
.pagination{display:flex;gap:6px;justify-content:center;margin-top:18px}
.pagination button{padding:5px 14px;border-radius:6px;border:1px solid var(--border);background:white;color:var(--text2);cursor:pointer;font-size:.85rem;transition:.2s}
.pagination button:hover{background:var(--bg)}
.pagination button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;z-index:300;animation:slideIn .3s ease;font-size:.9rem;max-width:360px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast-success{background:#48bb78;color:#fff}.toast-error{background:#ef4444;color:#fff}
.hidden{display:none!important}
.toggle-switch{position:relative;display:inline-block;width:44px;height:24px}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#cbd5e0;border-radius:24px;transition:.3s}
.toggle-slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.3s}
input:checked+.toggle-slider{background:var(--accent)}input:checked+.toggle-slider:before{transform:translateX(20px)}
.page-header{margin-bottom:28px}.page-header h2{font-size:1.5rem;margin-bottom:6px;color:var(--text)}.page-header p{font-size:.88rem;color:var(--muted)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}.empty-state svg{margin-bottom:12px;opacity:.3}
.step-accordion{border:1px solid var(--border);border-radius:8px;margin-bottom:6px;overflow:hidden}
.step-accordion-header{padding:12px 16px;background:var(--bg);cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .2s;font-weight:500}
.step-accordion-header:hover{background:#edf2f7}
.step-accordion-body{padding:16px;border-top:1px solid var(--border);display:none}.step-accordion-body.open{display:block}
.kb-preview{white-space:pre-wrap;max-height:80px;overflow:hidden;font-size:.8rem;color:var(--muted)}
.token-bar{display:flex;align-items:flex-end;gap:4px;height:100px}
.token-bar-item{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;transition:height .4s;position:relative}
.token-bar-item:hover{filter:brightness(1.1)}
.token-bar-item .tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#1a202c;color:#fff;padding:2px 8px;border-radius:4px;font-size:.65rem;white-space:nowrap;opacity:0;transition:.2s}
.token-bar-item:hover .tip{opacity:1}
.status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.status-dot.online{background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.5)}.status-dot.offline{background:#a0aec0}
.input-field{width:100%;height:42px;padding:0 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:white;transition:border-color .2s;outline:none;color:var(--text)}
.input-field:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(102,126,234,.1)}
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-bottom:28px}
.content-panel{background:white;border-radius:12px;border:1px solid var(--border);padding:24px;margin-bottom:24px}
.panel-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.panel-content{color:var(--text2);line-height:1.6}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.filter-bar select,.filter-bar input{height:38px;padding:0 12px;border:1px solid var(--border);border-radius:8px;font-size:.85rem;background:white;outline:none}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--accent)}
.chart-container{position:relative}.chart-container .x-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:.65rem;color:var(--muted)}
.top-user-bar{display:flex;align-items:center;gap:8px;padding:6px 0}.top-user-bar .rank{width:24px;text-align:center;font-weight:700;color:var(--muted)}.top-user-bar .progress-wrap{flex:1;height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden}.top-user-bar .progress-fill{height:100%;background:var(--accent);border-radius:3px}
</style>
</head>
<body>

<aside class="sidebar">
<div style="padding:20px 18px;border-bottom:1px solid var(--border)">
    <h1 style="font-size:1.15rem;font-weight:700;color:var(--accent)">⚡ 云海睿评</h1>
    <p style="font-size:0.72rem;color:#64748b;margin-top:3px">管理员控制面板</p>
</div>
<nav style="flex:1;overflow-y:auto;margin-top:8px">

<div class="nav-section">📊 系统总览</div>
<div class="nav-item active" data-page="dashboard"><i data-lucide="layout-dashboard" style="width:18px;height:18px"></i>仪表盘</div>

<div class="nav-section">🛡️ 客户端管控</div>
<div class="nav-item" data-page="client-control"><i data-lucide="shield-check" style="width:18px;height:18px"></i>客户端管控中心</div>
<div class="nav-item" data-page="notifications"><i data-lucide="bell" style="width:18px;height:18px"></i>通知</div>

<div class="nav-section">👥 用户与资源</div>
<div class="nav-item" data-page="users"><i data-lucide="users" style="width:18px;height:18px"></i>用户管理</div>
<div class="nav-item" data-page="models"><i data-lucide="cpu" style="width:18px;height:18px"></i>模型管理</div>

<div class="nav-section">📝 内容配置</div>
<div class="nav-item" data-page="prompts"><i data-lucide="file-code" style="width:18px;height:18px"></i>提示词管理</div>
<div class="nav-item" data-page="knowledge"><i data-lucide="book-open" style="width:18px;height:18px"></i>知识库</div>
<div class="nav-item" data-page="templates"><i data-lucide="layout-template" style="width:18px;height:18px"></i>模板管理</div>
<div class="nav-item" data-page="module-seq"><i data-lucide="list-ordered" style="width:18px;height:18px"></i>模块排序</div>
<div class="nav-item" data-page="step-config"><i data-lucide="git-branch" style="width:18px;height:18px"></i>步骤配置</div>
<div class="nav-item" data-page="indicators"><i data-lucide="list-tree" style="width:18px;height:18px"></i>指标类型</div>

<div class="nav-section">📈 监控与审计</div>
<div class="nav-item" data-page="workflows"><i data-lucide="workflow" style="width:18px;height:18px"></i>工作流监控</div>
<div class="nav-item" data-page="audit"><i data-lucide="file-text" style="width:18px;height:18px"></i>审计日志</div>
<div class="nav-item" data-page="file-mgmt"><i data-lucide="folder" style="width:18px;height:18px"></i>文件管理</div>
<div class="nav-item" data-page="cleanup"><i data-lucide="trash-2" style="width:18px;height:18px"></i>数据清理</div>

<div class="nav-section">⚙️ 配置</div>
<div class="nav-item" data-page="settings"><i data-lucide="settings" style="width:18px;height:18px"></i>系统设置</div>

</nav>
<div style="padding:12px 18px;border-top:1px solid var(--border)">
    <div class="nav-item" id="logout-btn"><i data-lucide="log-out" style="width:18px;height:18px"></i>退出登录</div>
</div>
</aside>

<main class="main-content" id="main-content"></main>

<div id="toast-container"></div>
<div id="modal-container"></div>

<script>
var API_BASE='/api/admin',AUTH_API='/api/auth';
var accessToken=localStorage.getItem('access_token')||localStorage.getItem('token')||sessionStorage.getItem('token')||'';
var currentPage='dashboard';

document.addEventListener('DOMContentLoaded',function(){
    try{lucide.createIcons()}catch(e){};
    if(!accessToken){
        var p=new URLSearchParams(window.location.search);
        var t=p.get('token');
        if(t){accessToken=t;localStorage.setItem('access_token',t);localStorage.setItem('token',t);window.history.replaceState({},'','/admin')}
        else{window.location.href='/login?redirect=/admin';return}
    }
    setupNavigation();
    navigateTo('dashboard');
});

function setupNavigation(){
    document.querySelectorAll('.nav-item[data-page]').forEach(function(item){
        item.addEventListener('click',function(){navigateTo(item.dataset.page)})
    });
    document.getElementById('logout-btn')&&document.getElementById('logout-btn').addEventListener('click',logout);
}

function navigateTo(page){
    currentPage=page;
    document.querySelectorAll('.nav-item[data-page]').forEach(function(i){i.classList.remove('active')});
    var el=document.querySelector('.nav-item[data-page="'+page+'"]');
    if(el)el.classList.add('active');
    switch(page){
        case 'dashboard':renderDashboard();break;
        case 'client-control':renderClientControl();break;
        case 'notifications':renderNotifications();break;
        case 'users':loadUsers();break;
        case 'models':loadModels();break;
        case 'prompts':loadPrompts();break;
        case 'knowledge':loadKnowledge();break;
        case 'templates':loadTemplates();break;
        case 'module-seq':loadModuleSequences();break;
        case 'step-config':loadStepConfig();break;
        case 'indicators':loadIndicatorTypes();break;
        case 'workflows':loadWorkflows();break;
        case 'audit':loadAuditLogs();break;
        case 'settings':loadSettings();break;
        case 'file-mgmt':loadFileManagement();break;
        case 'cleanup':loadCleanupPage();break;
    }
}

function logout(){localStorage.removeItem('access_token');localStorage.removeItem('token');localStorage.removeItem('refresh_token');sessionStorage.removeItem('token');window.location.href='/'}

async function api(url,method,body){
    method=method||'GET';
    var headers={'Content-Type':'application/json','Authorization':'Bearer '+accessToken};
    var opts={method:method,headers:headers};
    if(body)opts.body=JSON.stringify(body);
    try{
        var resp=await fetch(url,opts);
        if(resp.status===401){
            var rt=localStorage.getItem('refresh_token');
            if(rt){
                try{
                    var r=await fetch(AUTH_API+'/refresh?refresh_token_str='+rt,{method:'POST'});
                    if(r.ok){var d=await r.json();accessToken=d.data.access_token;localStorage.setItem('access_token',accessToken);localStorage.setItem('token',accessToken);headers.Authorization='Bearer '+accessToken;var rr=await fetch(url,opts);return rr.ok?rr.json():null}
                }catch(e){}
            }
            logout();return null;
        }
        if(!resp.ok){showToast('请求失败: '+resp.status,true);return null;}
        return resp.json();
    }catch(e){
        showToast('网络错误，请检查连接',true);
        return null;
    }
}

function showToast(msg,type){type=type||'success';var c=document.getElementById('toast-container'),t=document.createElement('div');t.className='toast toast-'+type;t.textContent=msg;c.appendChild(t);setTimeout(function(){t.remove()},3000)}

function formatTime(iso){if(!iso)return'-';try{return new Date(iso).toLocaleString('zh-CN',{hour12:false})}catch(e){return iso}}

function debounce(fn,delay){var timer;return function(){var ctx=this,args=arguments;clearTimeout(timer);timer=setTimeout(function(){fn.apply(ctx,args)},delay)}}

function showModal(html){closeModal();var ov=document.createElement('div');ov.className='modal-overlay';ov.id='current-modal';var md=document.createElement('div');md.className='modal';md.innerHTML=html;ov.appendChild(md);ov.addEventListener('click',function(e){if(e.target===ov)closeModal()});document.body.appendChild(ov)}
function closeModal(){var m=document.getElementById('current-modal');if(m)m.remove()}

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function tok(n){if(!n)return'0';if(n<1000)return String(n);if(n<1e6)return (n/1e3).toFixed(1)+'K';return (n/1e6).toFixed(1)+'M'}

// ===========================
//  DASHBOARD
// ===========================
async function renderDashboard(){
    var main=document.getElementById('main-content');
    main.innerHTML='<div class="empty-state"><p>加载中...</p></div>';
    var dash=await api(API_BASE+'/dashboard');
    var token=await api(API_BASE+'/token-stats');
    var chatStat=await api(API_BASE+'/ai-chat-stats');
    var sett=await api(API_BASE+'/settings');
    if(!dash||!dash.success){main.innerHTML='<p style="color:#ef4444">加载失败</p>';return}
    var d=dash.data.overview,logs=dash.data.recent_operations;
    var tokData=token&&token.success?token.data:null;
    var cData=chatStat&&chatStat.success?chatStat.data:null;
    var aiEnabled=sett&&sett.success?sett.data.ai_chat_enabled:true;

    main.innerHTML=
    '<div class="page-header"><h2>📊 系统总览</h2><p>实时掌握系统运行状态与客户端使用情况</p></div>'+

    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:20px">'+
    statCard2('👥 总用户',tok(d.total_users),'今日活跃 '+tok(d.active_users_today))+
    statCard2('📁 工作流',tok(d.total_projects),'运行中 '+tok(d.active_workflows)+' | 完成 '+tok(d.completed_workflows))+
    statCard2('🪙 Token消耗',tok(d.total_tokens_used),'本周 '+tok(tokData?tokData.overview.week_tokens:0))+
    (cData?statCard2('💬 AI对话',tok(cData.total_conversations),'消息 '+tok(cData.total_messages)+' | 今日活跃 '+tok(cData.active_conversations_today)):'')+
    '<div class="stat-card" style="grid-column:span 1;border:2px solid '+(aiEnabled?'#6FFF00':'#ef4444')+'">'+
    '<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px">'+
    '<span class="status-dot '+(aiEnabled?'online':'offline')+'"></span>'+
    '<span style="font-weight:600">AI聊天</span></div>'+
    '<div class="value" style="font-size:1.2rem;color:'+(aiEnabled?'#6FFF00':'#94a3b8')+'">'+(aiEnabled?'运行中':'已关闭')+'</div>'+
    '<div style="margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px">'+
    '<label class="toggle-switch" style="width:52px;height:28px"><input type="checkbox" id="dash-ai-toggle" '+(aiEnabled?'checked':'')+' onchange="toggleAIDash(this.checked)"><span class="toggle-slider" style="height:28px"></span></label>'+
    '<span style="font-size:0.72rem;color:#94a3b8">客户端+管理端</span></div></div>'+
    '</div>'+

    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">'+
    '<div class="card"><h3 style="font-size:0.95rem;margin-bottom:12px">🪙 Token消耗趋势（近30天）</h3>'+(tokData&&tokData.daily_trend.length?renderTokenTrend(tokData.daily_trend):'<p style="color:var(--muted);font-size:0.85rem">暂无数据</p>')+'</div>'+
    '<div class="card"><h3 style="font-size:0.95rem;margin-bottom:12px">🏆 Token消耗 Top 10 用户</h3>'+(tokData&&tokData.top_users.length?renderTopUsers(tokData.top_users):'<p style="color:var(--muted);font-size:0.85rem">暂无数据</p>')+'</div>'+
    '</div>'+

    '<div class="card"><h3 style="font-size:0.95rem;margin-bottom:12px">📋 最近操作</h3>'+
    '<table class="table-view"><thead><tr><th>用户</th><th>操作</th><th>详情</th><th>时间</th></tr></thead><tbody>'+
    (logs||[]).map(function(l){return '<tr><td>'+esc(l.username||'-')+'</td><td><span class="badge badge-info">'+esc(l.action)+'</span></td><td>'+esc(l.detail||'-')+'</td><td style="font-size:0.78rem;color:var(--muted)">'+formatTime(l.created_at)+'</td></tr>'}).join('')+
    '</tbody></table></div>';
}

function statCard2(label,value,sub){return '<div class="stat-card"><div class="label">'+label+'</div><div class="value">'+value+'</div><div class="sub">'+sub+'</div></div>'}

function renderTokenTrend(trend){
    var max=0;trend.forEach(function(d){if(d.tokens>max)max=d.tokens});
    if(max===0)max=1;
    var h='<div class="token-bar">';
    trend.forEach(function(d){var pct=Math.max(2,(d.tokens/max)*100);h+='<div class="token-bar-item" style="height:'+pct+'%"><span class="tip">'+d.date.slice(5)+': '+tok(d.tokens)+'</span></div>'});
    h+='</div><div style="display:flex;justify-content:space-between;font-size:0.65rem;color:var(--muted);margin-top:4px"><span>'+trend[0].date.slice(5)+'</span><span>'+trend[trend.length-1].date.slice(5)+'</span></div>';
    return h
}

function renderTopUsers(users){
    var max=users[0].tokens_used||1;
    var h='';users.forEach(function(u,i){
        var pct=(u.tokens_used/max)*100;

var usersPage=1,usersSearch='',usersRole='',usersSort='';
async function loadUsers(){
    var main=document.getElementById('main-content');
    main.innerHTML=
        '<div class="page-header"><h2>👥 用户管理</h2><p>管理系统用户账号、权限与Token消耗</p></div>'+
        '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center">'+
        '<input id="user-search" placeholder="搜索用户名..." style="padding:7px 11px;background:white;border:1px solid var(--border);border-radius:7px;color:var(--text);width:160px;font-size:0.85rem">'+
        '<select id="user-role-filter" style="padding:7px 11px;background:white;border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:0.85rem"><option value="">全部角色</option><option value="admin">管理员</option><option value="user">普通用户</option></select>'+
        '<select id="user-sort" style="padding:7px 11px;background:white;border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:0.85rem"><option value="">默认排序</option><option value="tokens_desc">Token最多</option><option value="tokens_asc">Token最少</option></select>'+
        '<button class="btn btn-primary" onclick="showCreateUserModal()">+ 创建用户</button>'+
        '</div>'+
        '<div id="users-table-container" class="card"><div class="empty-state">加载中...</div></div>'+
        '<div id="users-pagination" class="pagination"></div>';
    document.getElementById('user-search').addEventListener('input',debounce(function(){usersSearch=this.value;usersPage=1;refreshUsers()},300));
    document.getElementById('user-role-filter').addEventListener('change',function(){usersRole=this.value;usersPage=1;refreshUsers()});
    document.getElementById('user-sort').addEventListener('change',function(){usersSort=this.value;usersPage=1;refreshUsers()});
    await refreshUsers();
}

async function refreshUsers(){
    var params=new URLSearchParams({page:usersPage,page_size:20});
    if(usersSearch)params.set('search',usersSearch);
    if(usersRole)params.set('role',usersRole);
    var resp=await api(API_BASE+'/users?'+params);
    var c=document.getElementById('users-table-container');
    var pagDiv=document.getElementById('users-pagination');
    if(!resp||!resp.success){c.innerHTML='<p style="color:#ef4444">加载失败</p>';return}
    var users=resp.data.users,total=resp.data.total,page=resp.data.page,ps=resp.data.page_size;
    // Sort client-side if token sort selected
    if(usersSort==='tokens_desc')users.sort(function(a,b){return (b.tokens_used||0)-(a.tokens_used||0)});
    else if(usersSort==='tokens_asc')users.sort(function(a,b){return (a.tokens_used||0)-(b.tokens_used||0)});
    var tp=Math.ceil(total/ps);
    c.innerHTML='<table class="table-view"><thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>状态</th><th>🪙 Token</th><th>最近登录</th><th>注册时间</th><th>操作</th></tr></thead><tbody>'+
    users.map(function(u){return '<tr><td>'+u.id+'</td><td><strong>'+esc(u.username)+'</strong></td><td><span class="badge '+(u.role==='admin'?'badge-warning':'badge-info')+'">'+u.role+'</span></td><td><span class="badge '+(u.is_active?'badge-success':'badge-danger')+'">'+(u.is_active?'启用':'禁用')+'</span></td><td style="font-weight:600;color:'+((u.tokens_used||0)>10000?'var(--warning)':'var(--accent)')+'">'+tok(u.tokens_used)+'</td><td style="font-size:0.78rem;color:var(--muted)">'+formatTime(u.last_login)+'</td><td style="font-size:0.78rem;color:var(--muted)">'+formatTime(u.created_at)+'</td><td><button class="btn btn-sm" data-action="detail" data-uid="'+u.id+'">详情</button><button class="btn btn-sm '+(u.is_active?'btn-danger':'')+'" data-action="toggle" data-uid="'+u.id+'" data-enable="'+(!u.is_active)+'">'+(u.is_active?'禁用':'启用')+'</button>'+(u.role!=='admin'?'<button class="btn btn-sm btn-danger" data-action="deactivate" data-uid="'+u.id+'" style="background:#c53030;color:#fff;border:none">注销</button>':'')+'</td></tr>'}).join('')+
    '</tbody></table>';
    pagDiv.innerHTML='';
    if(tp>1){for(var i=1;i<=tp;i++){var b=document.createElement('button');b.textContent=i;if(i===page)b.classList.add('active');b.addEventListener('click',function(p){return function(){usersPage=p;refreshUsers()}}(i));pagDiv.appendChild(b)}}
}

// 用户表格事件委托（避免 inline onclick 中的字符串转义问题）
document.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-action]');
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    var uid = parseInt(btn.getAttribute('data-uid'));
    if (!uid) return;
    if (action === 'detail') viewUserDetail(uid);
    else if (action === 'toggle') toggleUser(uid, btn.getAttribute('data-enable') === 'true');
    else if (action === 'deactivate') {
        var row = btn.closest('tr');
        var nameEl = row ? row.querySelector('td:nth-child(2) strong') : null;
        var userName = nameEl ? nameEl.textContent : '用户#' + uid;
        deactivateUser(uid, userName);
    }
});

}
async function toggleModel(id,e){var r=await api(API_BASE+'/models/'+id+'/toggle','PATCH',{is_enabled:e});if(r&&r.success)showToast(r.message);else{showToast('操作失败','error');refreshModels()}}
async function deleteModel(id){if(!confirm('确定删除？'))return;var r=await api(API_BASE+'/models/'+id,'DELETE');if(r&&r.success){showToast('已删除');refreshModels()}else{showToast(r&&r.detail||'删除失败','error')}}
