    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f8f9fa;overflow:hidden}.app-container{display:flex;height:100vh;width:100vw}.mobile-toggle{position:fixed;top:24px;left:24px;z-index:50;padding:12px;border-radius:8px;background:white;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;display:none;transition:all .2s}.mobile-toggle:hover{background:#f8f9fa}.mobile-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:30;display:none;transition:opacity .3s}.mobile-overlay.show{display:block}
