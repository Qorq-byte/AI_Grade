<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报告预览编辑 — 云海睿评</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #e2e8f0;
            --accent: #6FFF00;
            --muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }
        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
        }
        @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
        .panel {
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid var(--border);
        }
        .panel:last-child { border-right: none; }
        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { background: #334155; }
        .btn-accent { background: var(--accent); color: #000; border-color: var(--accent); }
        .btn-accent:hover { background: #5ee600; }
        .btn-sm { padding: 4px 10px; font-size: 0.7rem; }
        .btn-danger { border-color: #ef4444; color: #ef4444; }
        .btn-danger:hover { background: rgba(239,68,68,0.1); }
        #editor {
            width: 100%;
            min-height: 400px;
            background: #0a0f1e;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            color: var(--text);
            font-size: 0.9rem;
            line-height: 1.7;
            font-family: 'Consolas', 'Monaco', monospace;
            resize: vertical;
        }
        #editor:focus {
            outline: none;
            border-color: var(--accent);
        }
        #preview {
            background: #0a0f1e;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            font-size: 0.9rem;
            line-height: 1.8;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            min-height: 400px;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
        }
        #preview h1 { font-size: 1.6rem; margin-bottom: 12px; }
        #preview h2 { font-size: 1.2rem; margin: 16px 0 8px; }
        #preview h3 { font-size: 1rem; margin: 12px 0 6px; }
        #preview p { margin: 4px 0; }
        #preview ul, #preview ol { padding-left: 20px; margin: 6px 0; }
        .step-section {
            margin-bottom: 20px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card);
        }
        .step-section h3 {
            margin-top: 0;
            font-size: 0.95rem;
            color: var(--accent);
        }
        .info-banner {
            background: rgba(59,130,246,0.1);
            border: 1px solid #3b82f6;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 0.85rem;
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 300;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } }
        .toast-success { background: #22c55e; color: #fff; }
        .toast-error { background: #ef4444; color: #fff; }
    </style>
</head>
<body>
    <div class="layout">
        <!-- Left: Editor -->
        <div class="panel">
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                <a href="/" style="color:var(--muted); text-decoration:none; font-size:0.8rem;">← 返回</a>
                <h2 style="font-size:1.1rem;">✏️ 报告编辑器</h2>
                <span id="modified-badge" style="display:none; background:#f59e0b; color:#000; padding:2px 8px; border-radius:10px; font-size:0.7rem; font-weight:600;">已修改</span>
            </div>

            <div class="toolbar">
                <button class="btn btn-accent" onclick="saveReport()">💾 保存</button>
                <button class="btn" onclick="refreshPreview()">👁️ 刷新预览</button>
                <button class="btn" onclick="exportEditedReport('word')">📄 导出Word</button>
                <button class="btn" onclick="exportEditedReport('pdf')">📕 导出PDF</button>
                <button class="btn btn-sm" onclick="insertTemplate()">📝 插入模板</button>
                <button class="btn btn-sm btn-danger" onclick="resetToOriginal()">↩️ 恢复原始</button>
            </div>

            <textarea id="editor" placeholder="报告内容加载中..."></textarea>

            <!-- Step-by-step sections for awareness -->
            <div id="step-sections" style="margin-top:16px;"></div>
        </div>

        <!-- Right: Preview -->
        <div class="panel">
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                <h2 style="font-size:1.1rem;">📄 实时预览</h2>
                <span style="font-size:0.75rem; color:var(--muted);" id="word-count">0 字</span>
            </div>
            <div id="preview"><em style="color:var(--muted);">等待编辑器中输入内容...</em></div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
    let sessionId = '';
    let originalReport = '';
    let isModified = false;
    const API = '/api/agent';
    function authFetch(url, options = {}) {
        const headers = new Headers(options.headers);
        const token = sessionStorage.getItem('token') || localStorage.getItem('token');
        if (token) headers.set('Authorization', 'Bearer ' + token);
        return fetch(url, { ...options, headers });
    }

    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();

        const params = new URLSearchParams(window.location.search);
        sessionId = params.get('session') || '';

        if (sessionId) {
            loadReport();
        } else {
            document.getElementById('editor').value = '';
            document.getElementById('editor').placeholder = '未提供 session ID。请从工作流页面跳转至此，或在URL添加 ?session=xxx';
        }

        document.getElementById('editor').addEventListener('input', () => {
            isModified = document.getElementById('editor').value !== originalReport;
            document.getElementById('modified-badge').style.display = isModified ? 'inline-block' : 'none';
            debouncedPreview();
        });

        // Keyboard shortcut: Ctrl+S to save
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveReport();
            }
        });
    });

    async function loadReport() {
        document.getElementById('editor').placeholder = '加载中...';

        try {
            const resp = await authFetch(`${API}/workflow/${sessionId}/status`);
            const data = await resp.json();

            if (!data.success || !data.data) {
                showToast('加载失败: 工作流不存在', 'error');
                return;
            }

            // Load step results
            const stepSummaries = data.data.step_summaries || [];
            loadStepSections(stepSummaries);

            // Try to get full report via completion state
            // For now, use the step content previews
            let reportContent = '';

            // Fetch detailed step contents
            // We'll use the step_results from a hypothetical complete state
            // In production, we need a get_full_report endpoint
            reportContent = await fetchFullReport();

            if (!reportContent || reportContent.trim().length < 50) {
                // Build from step summaries
                reportContent = buildReportFromSteps(data.data);
            }

            originalReport = reportContent;
            document.getElementById('editor').value = reportContent;
            document.getElementById('editor').placeholder = '在此编辑报告内容...';
            refreshPreview();
            updateWordCount();
            showToast('报告加载完成');
        } catch (e) {
            showToast('加载失败: ' + e.message, 'error');
            document.getElementById('editor').placeholder = '加载失败，请刷新重试';
        }
    }

    async function fetchFullReport() {
        try {
            const resp = await authFetch(`${API}/workflow/${sessionId}/report`);
            const data = await resp.json();
            if (data.data?.review_steps?.length) {
                showToast('上游已修改，待复核步骤：' + data.data.review_steps.join('、'), 'error');
            }
            if (data.success && data.data.content) {
                return data.data.content;
            }
        } catch (e) { /* ignore */ }
        return '';
    }

    function buildReportFromSteps(data) {
        const parts = [];
        parts.push(`# ${data.project_name || '绩效评价报告'}\n`);
        parts.push(`*生成时间: ${new Date().toLocaleString('zh-CN')}*\n`);

        const stepNames = {
            1:'一、资料清单', 2:'二、有效信息', 3:'三、指标体系',
            4:'四、指标分值', 5:'五、评分标准', 6:'六、评价指标体系表',
            7:'七、指标得分分析', 8:'八、经验做法', 9:'九、问题及原因分析',
            10:'十、改进建议', 11:'十一、综合评价结论', 12:'十二、基本情况',
            13:'十三、评价工作简介', 14:'十四、完整报告'
        };

        const summaries = data.step_summaries || [];
        summaries.forEach(s => {
            const name = stepNames[s.step_number] || `Step ${s.step_number}`;
            parts.push(`\n## ${name}\n`);
            parts.push(s.content_preview || '*(内容待补充)*');
        });

        return parts.join('\n');
    }

    function loadStepSections(summaries) {
        const container = document.getElementById('step-sections');
        if (!summaries || !summaries.length) {
            container.innerHTML = '<p style="font-size:0.8rem; color:var(--muted);">暂无步骤数据</p>';
            return;
        }

        container.innerHTML = `
            <h4 style="font-size:0.85rem; margin-bottom:8px; color:var(--muted);">已完成步骤</h4>
            ${summaries.map(s => `
                <div class="step-section">
                    <h3>Step ${s.step_number} — ${s.step_name}</h3>
                    <p style="font-size:0.8rem; color:var(--muted);">${(s.content_preview || '').substring(0,100)}...</p>
                </div>
            `).join('')}
        `;
    }

    // ─── Preview ────────────────────────────────
    let debounceTimer;
    function debouncedPreview() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(refreshPreview, 300);
    }

    function refreshPreview() {
        const content = document.getElementById('editor').value;
        const preview = document.getElementById('preview');

        if (!content.trim()) {
            preview.innerHTML = '<em style="color:var(--muted);">等待编辑器中输入内容...</em>';
            updateWordCount();
            return;
        }

        // Simple markdown rendering
        preview.innerHTML = renderMarkdown(content);
        updateWordCount();
    }

    function renderMarkdown(md) {
        let html = md
            // Headers
            .replace(/^### (.+)$/gm, '<h3>$1</h3>')
            .replace(/^## (.+)$/gm, '<h2>$1</h2>')
            .replace(/^# (.+)$/gm, '<h1>$1</h1>')
            // Bold
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            // Italic
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            // Lists
            .replace(/^- (.+)$/gm, '<li>$1</li>')
            .replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>')
            // Line breaks
            .replace(/\n\n/g, '</p><p>')
            .replace(/\n/g, '<br>');

        return `<p>${html}</p>`;
    }

    function updateWordCount() {
        const text = document.getElementById('editor').value;
        const count = text.replace(/\s/g, '').length;
        document.getElementById('word-count').textContent = `${count} 字`;
    }

    // ─── Actions ───────────────────────────────
    async function saveReport() {
        if (!sessionId) return;
        const content = document.getElementById('editor').value;
        // Note: We need a save endpoint. For now, show a message.
        try {
            const resp = await authFetch(`${API}/workflow/save-report`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId, content }),
            });
            const data = await resp.json();
            if (data.success) {
                showToast('✅ 报告已保存到服务器');
                originalReport = content;
                isModified = false;
                document.getElementById('modified-badge').style.display = 'none';
            } else {
                showToast('保存失败: ' + (data.message || '未知错误'), 'error');
            }
        } catch(e) {
            showToast('保存失败: ' + e.message, 'error');
        }
    }

    function resetToOriginal() {
        if (confirm('确定恢复到原始报告吗？所有修改将丢失。')) {
            document.getElementById('editor').value = originalReport;
            isModified = false;
            document.getElementById('modified-badge').style.display = 'none';
            refreshPreview();
            showToast('已恢复');
        }
    }

    function insertTemplate() {
        const template = `\n## 模块标题\n\n### 1. 分项标题\n\n主要内容描述...\n\n* 要点一\n* 要点二\n* 要点三\n`;
        const editor = document.getElementById('editor');
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        const text = editor.value;
        editor.value = text.substring(0, start) + template + text.substring(end);
        editor.focus();
        editor.selectionStart = editor.selectionEnd = start + template.length;
        refreshPreview();
    }

    async function exportEditedReport(format) {
        if (!sessionId) {
            showToast('未关联工作流', 'error');
            return;
        }
        showToast('导出中...');
        try {
            const resp = await authFetch(`${API}/workflow/export`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId, format }),
            });
            const data = await resp.json();
            if (data.success) {
                showToast(`导出成功: ${data.data.file_name}`);
            } else {
                showToast('导出失败', 'error');
            }
        } catch (e) {
            showToast('导出失败: ' + e.message, 'error');
        }
    }

    function showToast(msg, type = 'success') {
        const container = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = `toast toast-${type}`;
        t.textContent = msg;
        container.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }
    </script>
</body>
</html>
